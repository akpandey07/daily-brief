name: Build and publish edition

on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST
    - cron: "30 12 * * *"  # 18:00 IST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build edition
        run: |
          pip install --quiet feedparser==6.0.12
          python scripts/restore_archive.py "${{ steps.pages.outputs.base_url }}"
          python scripts/build.py

      # Scheduled workflows pause after 60 days without repository activity,
      # so the first morning run of each month records a one-line heartbeat.
      - name: Monthly keep-alive
        if: github.event_name == 'schedule' && github.event.schedule == '30 0 * * *'
        run: |
          if [ "$(TZ=Asia/Kolkata date +%d)" = "01" ]; then
            date -u +%FT%TZ > .keepalive
            git config user.name "daily-brief-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive && git commit -m "Monthly keep-alive" && git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
